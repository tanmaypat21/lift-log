<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d111a" />
  <meta name="description" content="A local-first workout log with strength history and guided coaching intake." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="v04.css" />
  <title>Lift Log — Personal Workout Tracker</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">↗</span><div><strong>Lift Log</strong><small>YOUR TRAINING, TRACKED.</small></div></div>
      <button id="addExerciseTop" class="quiet-button" title="Add exercise">＋ <span>Exercise</span></button>
    </header>
    <main id="app" aria-live="polite"></main>
    <nav class="bottomnav" aria-label="Main navigation">
      <button data-tab="home" class="active"><span>⌂</span>Home</button>
      <button data-tab="exercises"><span>▤</span>Train</button>
      <button data-tab="history"><span>↗</span>Progress</button>
      <button data-tab="cardio"><span>♡</span>Cardio</button>
      <button data-tab="coach"><span>✳</span>Coach</button>
    </nav>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
  <script src="enhancements.js" defer></script>
</body>
</html>
